<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Mixed Delivery Invoice Tracker</title>
<style>
:root{--bg:#F3ECDF;--paper:#FBF7F0;--ink:#3B2A20;--muted:#7A6758;--moss:#5B6A3C;--line:#DCCDB4}
@media (prefers-color-scheme: dark){:root{--bg:#1D1713;--paper:#28201A;--ink:#EFE5D5;--muted:#B2A08D;--moss:#A3B37A;--line:#45382C}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:28px 32px;max-width:560px}
h1{font:600 26px/1.2 Georgia,serif;margin:0 0 10px}
p{margin:0 0 12px;color:var(--muted)}
a.btn{display:inline-block;background:var(--moss);color:#FBF7F0;text-decoration:none;padding:9px 16px;border-radius:6px;font-weight:600}
</style>
</head>
<body>
<div class="card">
  <h1>That page isn't here</h1>
  <p>The Mixed Delivery Invoice Tracker site is published, but the address you opened doesn't match a page on it.</p>
  <p>Use the button below to go to the tracker. If that also shows this message, <b>index.html</b> is missing from the repository's main folder.</p>
  <a class="btn" id="home" href="./">Open the tracker</a>
</div>
<script>
// Point the button at the site's root folder (e.g. /md-invoice-tracker/)
const parts=location.pathname.split("/").filter(Boolean);
if(location.hostname.endsWith("github.io") && parts.length) document.getElementById("home").href="/"+parts[0]+"/";
</script>
</body>
</html>
